name: tests

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - '*'
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git then prints a multi-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # tests/sipApiSurface.spec.js derives the expected API surface from these protos. Only this
      # submodule: ondewo-proto-compiler is not needed by any test. .gitmodules names it by SSH URL,
      # which a runner without a key cannot clone, so it is fetched over public HTTPS instead.
      - name: Check out the ondewo-sip-api submodule
        run: 'git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init src/ondewo-sip-api'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface only.
      # `npm test` runs node's built-in test runner under c8 and enforces TWO 100% line/branch/function
      # coverage gates: one on the D18 Keycloak offline-token auth provider (auth/offlineTokenProvider.js)
      # and one on the SIP register-account example (examples/sipStatusExample.js).
      - name: Unit tests + 100% coverage gates on hand-written auth and example code
        run: npm test
